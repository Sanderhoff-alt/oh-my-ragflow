name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-build-and-unit:
    name: Enterprise Server Build & Core Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOPRIVATE: github.com/infiniflow/onnxruntime_go
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-go@v6
        id: go
        with:
          go-version-file: upstream/ragflow/go.mod
          cache: false
      - name: Check extension Go formatting
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(git ls-files -z -- 'extensions/**/*.go')
          if (( ${#files[@]} )); then
            unformatted=$(gofmt -l "${files[@]}")
            if [[ -n "$unformatted" ]]; then
              printf 'Go files requiring gofmt:\n%s\n' "$unformatted"
              exit 1
            fi
          fi
      # Go's build cache does not track changes to external C libraries. Scope
      # it to the upstream revision and extension/build configuration.
      - name: Identify upstream revision
        id: upstream
        run: echo "sha=$(git -C upstream/ragflow rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-mod-${{ steps.go.outputs.go-version }}-${{ hashFiles('upstream/ragflow/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-mod-${{ steps.go.outputs.go-version }}-
            ${{ runner.os }}-${{ runner.arch }}-go-mod-
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-build-${{ steps.go.outputs.go-version }}-${{ steps.upstream.outputs.sha }}-${{ hashFiles('extensions/**', '.github/workflows/ci.yml', 'ci/clean-tokenizer-archive.py', 'upstream/ragflow/internal/binding/cpp/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-build-${{ steps.go.outputs.go-version }}-${{ steps.upstream.outputs.sha }}-
      - uses: astral-sh/setup-uv@v7
      - name: Prepare isolated build workspace with model-platform overlay
        run: bash extensions/model-platform/scripts/apply-overlay.sh
      - name: Cache native static libraries and archives
        uses: actions/cache@v4
        with:
          path: |
            ~/ragflow-native-libs
            build/ragflow/deps
          key: ${{ runner.os }}-${{ runner.arch }}-native-libs-${{ steps.upstream.outputs.sha }}
      - name: Install build dependencies
        run: |
          installed=false
          for i in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends lld-20 libpcre2-dev; then
              installed=true
              break
            fi
            echo "apt-get failed (attempt $i/5), retrying in 10s..."
            sleep 10
          done
          if [ "$installed" != "true" ]; then
            echo "Failed to install dependencies after 5 attempts" >&2
            exit 1
          fi
          sudo ln -sf /usr/bin/ld.lld-20 /usr/bin/ld.lld
      - name: Download native libraries and runtime resources
        working-directory: build/ragflow
        env:
          # The upstream pyproject pins a China-only PyPI mirror (mirrors.aliyun.com) as its default index,
          # and that mirror answers 403 to GitHub runners. The script only needs public PyPI packages.
          UV_NO_CONFIG: '1'
        run: uv run tools/scripts/download_dev_deps.py
      - name: Cache C++ tokenizer library
        id: cache-tokenizer
        uses: actions/cache@v4
        with:
          path: build/ragflow/internal/binding/cpp/cmake-build-release/librag_tokenizer_c_api.a
          key: ${{ runner.os }}-${{ runner.arch }}-tokenizer-ubuntu22_clang20-${{ hashFiles('upstream/ragflow/internal/binding/cpp/**', 'upstream/ragflow/build.sh', 'ci/clean-tokenizer-archive.py', '.github/workflows/ci.yml') }}
      - name: Build tokenizer library
        if: steps.cache-tokenizer.outputs.cache-hit != 'true'
        working-directory: build/ragflow
        run: |
          docker run --rm \
            -v "$PWD:/ragflow" \
            -w /ragflow \
            --entrypoint bash \
            infiniflow/infinity_builder:ubuntu22_clang20 \
            -c 'git config --global --add safe.directory /ragflow && ./build.sh --cpp'
          sudo chown -R "$(id -u):$(id -g)" internal/binding/cpp
      - name: Remove empty tokenizer linker-option sections
        if: steps.cache-tokenizer.outputs.cache-hit != 'true'
        working-directory: build/ragflow
        run: |
          python3 "$GITHUB_WORKSPACE/ci/clean-tokenizer-archive.py" \
            internal/binding/cpp/cmake-build-release/librag_tokenizer_c_api.a
      - name: Build Go server (Enterprise)
        working-directory: build/ragflow
        env:
          RAGFLOW_GO_TAGS: ee
        run: ./build.sh --go
      - name: Run upstream Go unit tests (Enterprise)
        working-directory: build/ragflow
        env:
          RAGFLOW_GO_TAGS: ee
        run: ./build.sh --test
      - name: Report scope
        if: always()
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo 'Enterprise Go build (RAGFLOW_GO_TAGS=ee) with model-platform overlay and unit tier; upstream integration, API, SDK and model-backed tests are not yet configured.' >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web Frontend Build & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstream/ragflow/web/package-lock.json
      - name: Prepare isolated build workspace with model-platform overlay
        run: bash extensions/model-platform/scripts/apply-overlay.sh
      - name: Install frontend dependencies
        working-directory: build/ragflow/web
        run: npm ci --no-audit --no-fund
      - name: Lint and check formatting of frontend overlay
        working-directory: build/ragflow/web
        run: |
          prefix=extensions/model-platform/overlay/web/
          files=()
          while IFS= read -r -d '' file; do
            target=${file#"$prefix"}
            if [[ ! -f "$target" ]]; then
              echo "Missing assembled overlay file: $target" >&2
              exit 1
            fi
            files+=("$target")
          done < <(git -C "$GITHUB_WORKSPACE" ls-files -z -- "${prefix}*.ts" "${prefix}*.tsx" "${prefix}*.js" "${prefix}*.jsx")
          if (( ${#files[@]} )); then
            ./node_modules/.bin/oxlint --max-warnings 0 "${files[@]}"
            ./node_modules/.bin/oxfmt --check "${files[@]}"
          fi
      - name: Type-check and test model-platform frontend overlay
        run: node ci/run-extension-web-tests.cjs
      - name: Build frontend
        working-directory: build/ragflow/web
        env:
          VITE_MINIFY: esbuild
          VITE_BUILD_SOURCEMAP: 'false'
        run: npm run build
      - name: Run upstream frontend tests
        run: node ci/run-upstream-web-tests.cjs

  model-platform:
    name: Model Platform Audit & Extension Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOPRIVATE: github.com/infiniflow/onnxruntime_go
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-go@v6
        id: go
        with:
          go-version-file: upstream/ragflow/go.mod
          cache: false
      - name: Identify upstream revision
        id: upstream
        run: echo "sha=$(git -C upstream/ragflow rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-${{ runner.arch }}-go-mod-${{ steps.go.outputs.go-version }}-${{ hashFiles('upstream/ragflow/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-mod-${{ steps.go.outputs.go-version }}-
            ${{ runner.os }}-${{ runner.arch }}-go-mod-
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-build-${{ steps.go.outputs.go-version }}-${{ steps.upstream.outputs.sha }}-${{ hashFiles('extensions/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-build-${{ steps.go.outputs.go-version }}-${{ steps.upstream.outputs.sha }}-
      - name: "Gate Check: Non-invasive compliance audit"
        run: bash extensions/model-platform/scripts/audit-non-invasive.sh
      - name: Start LiteLLM and PostgreSQL live test cluster
        run: bash extensions/model-platform/tests/e2e/setup_env.sh --start
      - name: Run model-platform backend unit and integration tests
        working-directory: build/ragflow
        env:
          REQUIRE_LIVE_GATEWAY: "true"
        run: CGO_ENABLED=0 go test -v -count=1 -tags ee ./extensions/model-platform/...
      - name: Teardown live test cluster
        if: always()
        run: docker compose -f extensions/model-platform/tests/e2e/docker-compose.test.yml down -v
      - name: "Post-run assertion: Verify upstream submodule remains 100% pristine"
        run: bash extensions/model-platform/scripts/audit-non-invasive.sh --cleanliness-only
